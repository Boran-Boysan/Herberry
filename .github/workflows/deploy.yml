name: Deploy to AWS Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/ubuntu/Herberry/backend
          
          echo "🔄 Backing up .env..."
          cp .env .env.backup 2>/dev/null || true
          
          echo "🔄 Fetching latest code..."
          git fetch --all
          
          echo "🔄 Resetting to origin/main..."
          git reset --hard origin/main
          
          echo "🔄 Restoring .env..."
          cp .env.backup .env 2>/dev/null || true
          
          echo "🔧 Fixing migration imports..."
          find apps/*/migrations -name "*.py" -type f ! -name "__init__.py" -exec sed -i 's/import products\.models/from apps.products import models/g' {} \; 2>/dev/null || true
          find apps/*/migrations -name "*.py" -type f ! -name "__init__.py" -exec sed -i 's/import cart\.models/from apps.cart import models/g' {} \; 2>/dev/null || true
          find apps/*/migrations -name "*.py" -type f ! -name "__init__.py" -exec sed -i 's/import orders\.models/from apps.orders import models/g' {} \; 2>/dev/null || true
          find apps/*/migrations -name "*.py" -type f ! -name "__init__.py" -exec sed -i 's/import subscriptions\.models/from apps.subscriptions import models/g' {} \; 2>/dev/null || true
          find apps/*/migrations -name "*.py" -type f ! -name "__init__.py" -exec sed -i 's/import accounts\.models/from apps.accounts import models/g' {} \; 2>/dev/null || true
          
          echo "🐍 Activating venv..."
          source venv/bin/activate
          
          echo "📦 Installing requirements..."
          pip install -r requirements.txt --quiet
          
          echo "🗄️ Running migrations..."
          python manage.py migrate --noinput
          
          echo "📁 Collecting static..."
          python manage.py collectstatic --noinput --clear
          
          echo "🔄 Restarting Gunicorn..."
          sudo systemctl restart gunicorn
          
          echo "✅ Done!"