{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi - Herberry</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">
                <span class="logo-text">H</span>
            </div>
            <h1>Admin Girişi</h1>
            <p class="subtitle">Herberry Yönetim Paneli</p>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">E-posta</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@herberry.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-button">Giriş Yap</button>
        </form>

        <div class="footer">
            <div class="footer-logo">
                <div class="footer-logo-icon">H</div>
                <span>Herberry</span>
            </div>
            <p class="footer-text">En taze sebze ve meyveler kapınızda</p>
        </div>
    </div>
</body>
</html>
